<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools Directory - Discover the Best AI Tools</title>
  <meta name="description" content="Discover the best AI tools for writing, coding, image generation, video, marketing and more. Updated daily with new tools, reviews and prompts.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2322c55e'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="navbar-left">
      <a href="index.html">
        <span class="navbar-dot"></span>
        <span>SiteName</span>
      </a>
    </div>
    <div class="navbar-search">
      <div class="search-bar" id="searchTrigger">
        <span>🔍</span>
        <span>Search AI tools...</span>
        <kbd>⌘K</kbd>
      </div>
    </div>
    <div class="navbar-right">
      <a href="submit.html" class="nav-link primary">Submit Tool</a>
      <a href="blog.html" class="nav-link">Blog</a>
      <a href="prompts.html" class="nav-link">Prompts</a>
    </div>
  </nav>

  <div class="container">
    <!-- STATS BAR -->
    <div class="stats-bar" id="statsBar">
      <span><strong id="statTools">0</strong>+ Tools</span>
      <span><strong id="statCategories">0</strong> Categories</span>
      <span class="updated">Updated Today: <strong id="statToday">0</strong></span>
    </div>

    <!-- NEW TODAY STRIP -->
    <div class="section-label">🆕 New Today</div>
    <div class="strip-scroll" id="newTodayStrip">
      <div class="mini-card skeleton-line" style="width:160px;height:36px;"></div>
      <div class="mini-card skeleton-line" style="width:160px;height:36px;"></div>
      <div class="mini-card skeleton-line" style="width:160px;height:36px;"></div>
    </div>

    <!-- MAIN AREA -->
    <div class="main-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Categories</div>
        <div id="sidebarCategories"><div class="skeleton-line" style="height:16px;margin:6px 0;"></div></div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-header">Quick Filters</div>
        <button class="sidebar-item" data-filter-key="pricing" data-filter-val="free">🆓 Free Only</button>
        <button class="sidebar-item" data-filter-key="tag" data-filter-val="trending">🔥 Trending</button>
        <button class="sidebar-item" data-filter-key="tag" data-filter-val="featured">⭐ Featured</button>
        <div class="sidebar-divider"></div>
        <div class="sidebar-header">Latest Prompts</div>
        <div id="sidebarPrompts"></div>
      </aside>

      <!-- CONTENT -->
      <div class="content">
        <!-- FILTER BAR -->
        <div class="filter-bar">
          <div class="filter-row" id="filterRow1">
            <button class="filter-pill active" data-key="reset" data-val="">All</button>
            <button class="filter-pill" data-key="tag" data-val="new">New</button>
            <button class="filter-pill" data-key="pricing" data-val="free">Free</button>
            <button class="filter-pill" data-key="pricing" data-val="freemium">Freemium</button>
            <button class="filter-pill" data-key="pricing" data-val="paid">Paid</button>
            <button class="filter-pill" data-key="tag" data-val="featured">⭐ Featured</button>
            <button class="filter-pill" data-key="tag" data-val="trending">🔥 Trending</button>
          </div>
          <div class="filter-row" id="filterRow2">
            <button class="filter-pill" data-key="blog" data-val="tutorial">📚 Tutorials</button>
            <button class="filter-pill" data-key="blog" data-val="review">📰 Reviews</button>
            <button class="filter-pill" data-key="blog" data-val="news">📣 News</button>
          </div>
        </div>

        <!-- TOOL GRID -->
        <div class="grid" id="toolGrid"></div>
        <div class="sentinel" id="sentinel">
          <span class="loader-spinner"></span>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">
          No tools found. Try a different filter.
        </div>

        <!-- PROMPT STRIP -->
        <div class="section-label" style="margin-top:40px;">
          🎨 Today's Prompts
          <a href="prompts.html" class="nav-link" style="margin-left:auto;color:var(--accent);">See All →</a>
        </div>
        <div class="prompt-strip-grid" id="promptStrip">
          <div class="skeleton" style="height:180px;"></div>
        </div>

        <!-- BLOG SECTION -->
        <div class="blog-section">
          <div class="blog-tabs" id="blogTabs">
            <button class="filter-pill active" data-blog-tab="review">Reviews</button>
            <button class="filter-pill" data-blog-tab="tutorial">Tutorials</button>
            <button class="filter-pill" data-blog-tab="news">News</button>
          </div>
          <div class="blog-grid" id="blogGrid">
            <div class="skeleton" style="height:140px;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="left" id="footerStats"><strong>0</strong>+ tools · Updated every 6hrs</div>
    <div class="center">
      <a href="submit.html">Submit Tool</a>
      <a href="rss.xml">RSS</a>
      <a href="blog.html">Blog</a>
    </div>
    <div class="subscribe-form">
      <input type="email" id="subscribeEmail" placeholder="your@email.com">
      <button class="subscribe-btn" id="subscribeBtn" title="Subscribe">→</button>
    </div>
  </footer>

  <!-- Mobile bottom sheet -->
  <button class="sheet-toggle" id="sheetToggle">☰</button>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="bottom-sheet" id="bottomSheet"></div>

  <!-- Search modal container -->
  <div id="searchModalRoot"></div>

  <script src="js/search.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

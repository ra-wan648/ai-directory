name: AI Directory Pipeline
on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Run pipeline
        run: cd scripts && python pipeline.py
        env:
          MANIFEST_BASE_URL: ${{secrets.MANIFEST_BASE_URL}}
          MANIFEST_API_KEY: ${{secrets.MANIFEST_API_KEY}}
          CF_ACCOUNT_ID: ${{secrets.CF_ACCOUNT_ID}}
          CF_API_TOKEN: ${{secrets.CF_API_TOKEN}}
          CF_D1_ID: ${{secrets.CF_D1_ID}}
          WORKER_URL: ${{secrets.WORKER_URL}}
          INTERNAL_API_KEY: ${{secrets.INTERNAL_API_KEY}}
          TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
          ADMIN_TELEGRAM_ID: ${{secrets.ADMIN_TELEGRAM_ID}}
# 

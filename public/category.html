<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools - AI Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2316A34A'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'>A</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="navbar-dot"></span>
      <a href="index.html" class="navbar-brand">AI Directory</a>
    </div>
    <div class="navbar-right">
      <a href="submit.html" class="nav-link primary">Submit Tool</a>
      <a href="blog.html" class="nav-link">Blog</a>
      <a href="prompts.html" class="nav-link">Prompts</a>
    </div>
  </nav>

  <div class="category-hero">
    <span class="emoji" id="cat-emoji">🛠️</span>
    <h1 id="cat-name">Category</h1>
    <span class="count" id="cat-count">0 tools</span>
  </div>

  <div class="filter-pills">
    <button data-filter="all" class="active">All</button>
    <button data-filter="free">Free</button>
    <button data-filter="freemium">Freemium</button>
    <button data-filter="paid">Paid</button>
    <button data-filter="new">New</button>
  </div>

  <div class="category-main">
    <div class="tab-bar">
      <button data-tab="recent" class="active">Recent</button>
      <button data-tab="new">New</button>
      <button data-tab="views">Top Rated</button>
    </div>
    <div id="tools-grid" class="grid-4"></div>
    <div class="load-more-wrap">
      <button class="load-more" id="load-more">Load More</button>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-title">AI Directory</div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="prompts.html">Prompts</a>
        <a href="submit.html">Submit Tool</a>
      </div>
      <div class="footer-copy">© 2026 AI Directory</div>
    </div>
  </footer>

  <script src="js/category.js" defer></script>
</body>
</html>

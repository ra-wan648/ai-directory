<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tool Detail - AI Directory</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2316A34A'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='800'>A</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="navbar-dot"></span>
      <a href="index.html" class="navbar-brand">AI Directory</a>
    </div>
    <div class="navbar-right">
      <a href="submit.html" class="nav-link primary">Submit Tool</a>
      <a href="blog.html" class="nav-link">Blog</a>
      <a href="prompts.html" class="nav-link">Prompts</a>
    </div>
  </nav>

  <div class="tool-layout">
    <main class="tool-main">
      <nav class="breadcrumb">
        <a href="index.html">Home</a> &gt; <a href="#" id="bc-cat">Category</a> &gt; <span id="bc-tool">Tool</span>
      </nav>

      <div class="tool-header">
        <div class="tool-screenshot" id="tool-screenshot-wrap">
          <img id="tool-screenshot" alt="Screenshot" hidden>
          <div class="screenshot-placeholder" id="screenshot-placeholder">
            <span>No screenshot</span>
          </div>
        </div>
        <div class="tool-info">
          <div class="tool-title-row">
            <img id="tool-favicon" alt="" width="48" height="48">
            <h1 id="tool-name">Loading...</h1>
            <span id="tool-pricing-badge" class="pricing-badge"></span>
          </div>
          <p id="tool-tagline" class="muted">Loading...</p>
          <div class="tool-actions">
            <button id="btn-save">❤ Save</button>
            <a id="btn-visit" class="btn-primary" target="_blank" rel="noopener">Try Now ↗</a>
          </div>
        </div>
      </div>

      <div class="tab-bar">
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="pricing">Pricing</button>
        <button data-tab="features">Features</button>
        <button data-tab="usecases">Use Cases</button>
        <button data-tab="alternatives">Alternatives</button>
        <button data-tab="discussions">Discussions</button>
      </div>
      <div id="tab-content" class="tab-content"></div>

      <section class="similar-section">
        <h3>Similar Tools</h3>
        <div id="similar-tools" class="grid-3"></div>
      </section>
    </main>

    <aside class="tool-sidebar">
      <div>
        <h4>Featured Tools</h4>
        <div id="featured-tools-list"></div>
      </div>
      <div>
        <h4>Top Categories</h4>
        <div id="top-categories-pills"></div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-title">AI Directory</div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="prompts.html">Prompts</a>
        <a href="submit.html">Submit Tool</a>
      </div>
      <div class="footer-copy">© 2026 AI Directory</div>
    </div>
  </footer>

  <script src="js/tool.js" defer></script>
</body>
</html>
